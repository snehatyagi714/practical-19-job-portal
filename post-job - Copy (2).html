<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Post a job | Northstar Careers</title><link rel="stylesheet" href="styles.css"></head><body data-page="post"><div id="site-header"></div><main class="page-shell"><div class="container narrow-container"><div class="page-intro centered-intro"><p class="eyebrow">FOR THOUGHTFUL TEAMS</p><h1>Meet someone <em>great.</em></h1><p>Share an opportunity with people ready for their next chapter.</p></div><form id="post-job-form" class="form-card"><div class="form-section-title"><span>01</span><div><h2>Role details</h2><p>Tell us about the opportunity.</p></div></div><div class="form-grid"><label class="form-label full">Job title<input required name="title" placeholder="e.g. Product Designer"></label><label class="form-label">Company<input required name="company" placeholder="Company name"></label><label class="form-label">Location<input required name="location" placeholder="City or Remote"></label><label class="form-label">Job type<select required name="type"><option value="">Choose one</option><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Internship</option></select></label><label class="form-label">Experience level<select required name="experience"><option value="">Choose one</option><option>Entry level</option><option>Mid level</option><option>Senior level</option></select></label><label class="form-label">Salary range<input name="salary" placeholder="e.g. ₹8–12 LPA"></label><label class="form-label">Company website<input name="website" type="url" placeholder="https://example.com"></label><label class="form-label full">Short description<textarea required name="description" rows="5" placeholder="What will this person do? What makes this role special?"></textarea></label></div><div class="form-actions"><p>Your role will appear in job listings on this device.</p><button class="btn btn-primary" type="submit">Publish this role <span>→</span></button></div><div id="post-success" class="success-message hidden" role="status">Your job is live! You can see it in the listings now.</div></form></div></main><div id="site-footer"></div><script src="data.js"></script><script src="app.js"></script></body></html>
