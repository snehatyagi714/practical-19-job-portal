<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Apply for a role | Northstar Careers</title><link rel="stylesheet" href="styles.css"></head><body data-page="apply"><div id="site-header"></div><main class="page-shell"><div class="container narrow-container"><a class="back-link" href="jobs.html">← Explore jobs</a><div class="page-intro"><p class="eyebrow">TAKE THE NEXT STEP</p><h1>Your next chapter <em>starts here.</em></h1><p id="apply-job-name">Introduce yourself to a team you’d love to join.</p></div><form id="apply-form" class="form-card"><div class="form-grid"><label class="form-label">Full name<input required name="name" autocomplete="name" placeholder="Your name"></label><label class="form-label">Email address<input required name="email" type="email" autocomplete="email" placeholder="you@example.com"></label><label class="form-label full">Role you’re applying for<input required id="apply-role" name="role" placeholder="Job title"></label><label class="form-label full">A short note<textarea name="note" rows="4" placeholder="Tell the team why this role feels right for you."></textarea></label><label class="form-label full">Resume (PDF only)<input required id="resume-file" name="resume" type="file" accept="application/pdf,.pdf"><small class="field-help">Please choose a PDF file, up to 5 MB.</small></label></div><div id="resume-error" class="error-message hidden" role="alert"></div><div class="form-actions"><p>Your details stay in this browser for the demo.</p><button class="btn btn-primary" type="submit">Send application <span>→</span></button></div><div id="apply-success" class="success-message hidden" role="status"></div></form></div></main><div id="site-footer"></div><script src="data.js"></script><script src="app.js"></script></body></html>
